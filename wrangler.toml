name = "traviosoft-website"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Serve the prerendered pages from the static assets (see scripts/cache-to-assets.mjs).
[build]
command = "node scripts/cache-to-assets.mjs"
