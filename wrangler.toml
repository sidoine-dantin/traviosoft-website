name = "traviosoft-website"
compatibility_date = "2025-01-01"
# Only runs for addresses with no file (see worker/index.ts). Every page is a static file.
main = "worker/index.ts"

[assets]
directory = "out"
binding = "ASSETS"

# Build the static site (next build with output: 'export' writes it to out/) before every deploy or upload.
[build]
command = "npm run build"
